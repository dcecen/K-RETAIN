<script>
"use strict";
const D = __DONNEES__;
const T = THREE;

// ----------------------------------------------------------------------------- scène
const conteneur = document.getElementById("vue");
const rendu = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
rendu.setPixelRatio(window.devicePixelRatio);
rendu.localClippingEnabled = true;
conteneur.appendChild(rendu.domElement);
const scene = new T.Scene();
scene.background = new T.Color(0xeef1f5);
const camera = new T.PerspectiveCamera(45, 1, 0.1, 5000);
scene.add(new T.AmbientLight(0xffffff, 0.65));
const soleil = new T.DirectionalLight(0xffffff, 0.9);
soleil.position.set(40, 80, 30);
scene.add(soleil);

// Repère : plan (x, y) et cote z  ->  three (x, z, -y)
const P = (x, y, z) => new T.Vector3(x, z, -y);

const C = D.contour;
const n = C.length;
let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
for (const [x, y] of C) { xmin = Math.min(xmin, x); xmax = Math.max(xmax, x); ymin = Math.min(ymin, y); ymax = Math.max(ymax, y); }
const taille = Math.max(xmax - xmin, ymax - ymin, 10);
const marge = Math.max(8, 0.5 * taille);
const aire = C.reduce((s, [x0, y0], i) => { const [x1, y1] = C[(i + 1) % n]; return s + x0 * y1 - x1 * y0; }, 0) / 2;
const sens = aire > 0 ? 1 : -1;
const H = D.paroi.tete - D.paroi.pied;
// Contour ouvert (coupe 2D infinie, paroi droite) : pas d'arête de fermeture ; terre et fouille sont deux bandes de
// part et d'autre de l'écran, coupées net aux bouts (même règle que la vue 3D de l'interface).
const ouvert = D.ferme === false && n >= 2;
const nA = ouvert ? n - 1 : n;
function decale(w) {
  const ni = [];
  for (let k = 0; k < nA; k++) { const A = C[k], B = C[k + 1], L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1; ni.push([-(B[1] - A[1]) / L * sens, (B[0] - A[0]) / L * sens]); }
  return C.map((P, i) => {
    const n1 = ni[Math.max(0, Math.min(i - 1, nA - 1))], n2 = ni[Math.min(i, nA - 1)];
    const bx = n1[0] + n2[0], by = n1[1] + n2[1], lb = Math.hypot(bx, by) || 1;
    const f = w / Math.max(0.2, (bx * n2[0] + by * n2[1]) / lb);
    return [P[0] + bx / lb * f, P[1] + by / lb * f];
  });
}
const butonsMax = Math.max(0, ...Object.values(D.appuis || {}).filter((a) => a.type === "buton").map((a) => (a.longueur || 0) + 1));
const CF = ouvert ? [...C, ...decale(Math.max(marge, butonsMax)).reverse()] : C;     // zone de la fouille
const CT = ouvert ? [...C, ...decale(-marge).reverse()] : null;                       // zone de terre (contour ouvert)
if (ouvert) for (const [x, y] of [...CF, ...CT]) { xmin = Math.min(xmin, x); xmax = Math.max(xmax, x); ymin = Math.min(ymin, y); ymax = Math.max(ymax, y); }
const margeExt = ouvert ? 0 : marge;

// ----------------------------------------------------------------------------- caméra (orbite)
const cible = P((xmin + xmax) / 2, (ymin + ymax) / 2, D.paroi.tete - 0.4 * H);
let rayon = 1.1 * (taille + 2 * marge) + H, theta = -0.9, phi = 0.95;
function placerCamera() {
  camera.position.set(cible.x + rayon * Math.sin(phi) * Math.cos(theta), cible.y + rayon * Math.cos(phi),
                      cible.z + rayon * Math.sin(phi) * Math.sin(theta));
  camera.lookAt(cible);
}
let glisse = null;
rendu.domElement.addEventListener("contextmenu", (e) => e.preventDefault());
rendu.domElement.addEventListener("pointerdown", (e) => { glisse = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey }; });
window.addEventListener("pointerup", () => { glisse = null; });
window.addEventListener("pointermove", (e) => {
  if (!glisse) return;
  const dx = e.clientX - glisse.x, dy = e.clientY - glisse.y;
  glisse.x = e.clientX; glisse.y = e.clientY;
  if (glisse.pan) {
    const droite = new T.Vector3().subVectors(camera.position, cible).cross(camera.up).normalize();
    const k = rayon / 800;
    cible.addScaledVector(droite, dx * k);
    cible.y += dy * k;
  } else {
    theta += dx * 0.005;
    phi = Math.min(Math.max(phi - dy * 0.005, 0.05), Math.PI - 0.05);
  }
  placerCamera();
});
rendu.domElement.addEventListener("wheel", (e) => { e.preventDefault(); rayon *= Math.exp(e.deltaY * 0.001); placerCamera(); }, { passive: false });

// ----------------------------------------------------------------------------- outils
const COULEURS_SOL = [0xe8d8b0, 0xd9c08c, 0xc9a96e, 0xb8925a, 0xd6c7a1, 0xa88a5c];
function matiere(couleur, opts = {}) { return new T.MeshLambertMaterial({ color: couleur, side: T.DoubleSide, ...opts }); }
function couleurEchelle(t) {
  const pal = [[0x2c, 0x7b, 0xb6], [0xab, 0xd9, 0xe9], [0xff, 0xff, 0xbf], [0xfd, 0xae, 0x61], [0xd7, 0x19, 0x1c]];
  t = Math.min(Math.max(t, 0), 1) * (pal.length - 1);
  const i = Math.min(Math.floor(t), pal.length - 2), f = t - i;
  return new T.Color(...pal[i].map((c, k) => (c + f * (pal[i + 1][k] - c)) / 255));
}
function interp(xs, ys, x) {
  if (x <= xs[0]) return ys[0];
  for (let i = 1; i < xs.length; i++) if (x <= xs[i]) { const t = (x - xs[i - 1]) / (xs[i] - xs[i - 1] || 1); return ys[i - 1] + t * (ys[i] - ys[i - 1]); }
  return ys[ys.length - 1];
}
function forme(points, trou) {
  const s = new T.Shape(points.map(([x, y]) => new T.Vector2(x, y)));
  if (trou) s.holes.push(new T.Path(trou.map(([x, y]) => new T.Vector2(x, y))));
  return s;
}
function bloc(points, trou, zBas, zHaut, mat) {
  if (zHaut - zBas < 1e-3) return null;
  const g = new T.ExtrudeGeometry(forme(points, trou), { depth: zHaut - zBas, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);               // (x, y) plan -> (x, -z) three ; extrusion selon +y
  g.translate(0, zBas, 0);
  return new T.Mesh(g, mat);
}
function cylindre(a, b, r, mat) {
  const v = new T.Vector3().subVectors(b, a), L = v.length();
  const g = new T.CylinderGeometry(r, r, L, 16);
  const m = new T.Mesh(g, mat);
  m.position.copy(a).addScaledVector(v, 0.5);
  m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), v.clone().normalize());
  return m;
}
function boite(centre, t, nrm, lt, ln, z0, z1, mat, segZ = 1) {
  const g = new T.BoxGeometry(lt, z1 - z0, ln, 1, segZ, 1);
  const m = new T.Mesh(g, mat);
  m.position.copy(P(centre[0], centre[1], (z0 + z1) / 2));
  m.rotation.y = Math.atan2(t[1], t[0]);  // axe local x selon la tangente (plan)
  return m;
}

// ----------------------------------------------------------------------------- couleurs de paroi
let echelle = { min: 0, max: 1, titre: "" };
function valeurParoi(ph, mode, s, z) {
  if (mode !== "u" && D.p3d && D.p3d.phases && D.p3d.phases[ph.index] && D.p3d.phases[ph.index].ok) {
    const q = D.p3d.phases[ph.index], g = mode === "M" ? q.M : q.y_mm, S = D.p3d.s, Z = D.p3d.z;
    if (g) {
      const i = Math.max(0, Math.min(S.length - 1, Math.round(interp(S, S.map((_, k) => k), s))));
      return interp(Z, g[i], z);
    }
  }
  if (!ph.profil) return 0;
  if (mode === "u") return interp(ph.profil.zu, ph.profil.u_amont, z);
  return mode === "M" ? interp(ph.profil.zM, ph.profil.M, z) : interp(ph.profil.z, ph.profil.y_mm, z);
}
function colorer(geom, ph, mode, sDe) {
  if (!mode) return;
  const pos = geom.attributes.position, coul = [];
  const v = new T.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const val = valeurParoi(ph, mode, sDe(v), v.y);
    const c = couleurEchelle((val - echelle.min) / (echelle.max - echelle.min || 1));
    coul.push(c.r, c.g, c.b);
  }
  geom.setAttribute("color", new T.Float32BufferAttribute(coul, 3));
}

// abscisse développée le long du contour d'un point three
const longueurs = [0];
for (let k = 0; k < nA; k++) { const [x0, y0] = C[k], [x1, y1] = C[(k + 1) % n]; longueurs.push(longueurs[k] + Math.hypot(x1 - x0, y1 - y0)); }
function abscisse(v) {
  const x = v.x, y = -v.z;
  let best = Infinity, sBest = 0;
  for (let k = 0; k < nA; k++) {
    const [x0, y0] = C[k], [x1, y1] = C[(k + 1) % n];
    const L = Math.hypot(x1 - x0, y1 - y0) || 1, tx = (x1 - x0) / L, ty = (y1 - y0) / L;
    const s = Math.min(Math.max((x - x0) * tx + (y - y0) * ty, 0), L);
    const d = Math.hypot(x0 + tx * s - x, y0 + ty * s - y);
    if (d < best) { best = d; sBest = longueurs[k] + s; }
  }
  return sBest;
}

// ----------------------------------------------------------------------------- paroi
function paroi(ph, mode, groupe) {
  const p = D.paroi;
  const matBase = mode ? new T.MeshLambertMaterial({ vertexColors: true, side: T.DoubleSide })
                       : matiere(p.type === "paroi_moulee" || p.type.startsWith("pieux") ? 0xa0a0a0 : 0x6d7b8a);
  for (let k = 0; k < nA; k++) {
    const A = C[k], B = C[(k + 1) % n];
    const L = Math.hypot(B[0] - A[0], B[1] - A[1]); if (L < 1e-6) continue;
    const t = [(B[0] - A[0]) / L, (B[1] - A[1]) / L];
    const ni = [-t[1] * sens, t[0] * sens];             // normale vers l'intérieur de la fouille
    const pt = (s, o = 0) => [A[0] + t[0] * s + ni[0] * o, A[1] + t[1] * s + ni[1] * o];
    if (p.type === "palplanche") {
      // rideau ondulé : zigzag de pas b et d'amplitude h/2
      const pas = Math.max(p.b, 0.3), amp = p.h, nb = Math.max(1, Math.round(L / pas));
      const pts = [];
      for (let i = 0; i <= 2 * nb; i++) pts.push(pt((i * L) / (2 * nb), (i % 2 ? 1 : -1) * amp / 2));
      const segZ = 24, pos = [], idx = [];
      for (let j = 0; j <= segZ; j++) {
        const z = p.pied + (H * j) / segZ;
        for (const [x, y] of pts) { const v = P(x, y, z); pos.push(v.x, v.y, v.z); }
      }
      const m = pts.length;
      for (let j = 0; j < segZ; j++) for (let i = 0; i < m - 1; i++) {
        const a = j * m + i, b = a + 1, c = a + m, d = c + 1;
        idx.push(a, b, d, a, d, c);
      }
      const g = new T.BufferGeometry();
      g.setAttribute("position", new T.Float32BufferAttribute(pos, 3));
      g.setIndex(idx); g.computeVertexNormals();
      colorer(g, ph, mode, abscisse);
      groupe.add(new T.Mesh(g, matBase));
    } else if (p.type === "paroi_moulee") {
      const nb = Math.max(1, Math.ceil(L / 5)), lp = L / nb;
      for (let i = 0; i < nb; i++) {
        const mesh = boite(pt((i + 0.5) * lp), t, ni, lp - 0.03, p.epaisseur, p.pied, p.tete, matBase, 24);
        mesh.updateMatrix(); mesh.geometry.applyMatrix4(mesh.matrix); mesh.position.set(0, 0, 0); mesh.rotation.set(0, 0, 0);
        colorer(mesh.geometry, ph, mode, abscisse);
        groupe.add(mesh);
      }
    } else if (p.type.startsWith("pieux")) {
      const nb = Math.max(1, Math.floor(L / p.entraxe));
      for (let i = 0; i < nb; i++) {
        const [x, y] = pt((i + 0.5) * L / nb);
        const g = new T.CylinderGeometry(p.diametre / 2, p.diametre / 2, H, 16, 24);
        g.translate(0, (p.tete + p.pied) / 2, 0);
        const v = P(x, y, 0); g.translate(v.x, 0, v.z);
        colorer(g, ph, mode, abscisse);
        groupe.add(new T.Mesh(g, matBase));
      }
    } else if (p.type === "berlinoise") {
      const nb = Math.max(1, Math.floor(L / p.entraxe));
      const matBois = matiere(0xb07a43);
      for (let i = 0; i <= nb; i++) {
        const s = (i * L) / nb;
        for (const o of [-p.h / 2 + p.tf / 2, p.h / 2 - p.tf / 2]) {   // ailes parallèles à la paroi
          const m = boite(pt(s, o), t, ni, p.b, p.tf, p.pied, p.tete, matBase, 24);
          m.updateMatrix(); m.geometry.applyMatrix4(m.matrix); m.position.set(0, 0, 0); m.rotation.set(0, 0, 0);
          colorer(m.geometry, ph, mode, abscisse); groupe.add(m);
        }
        const w = boite(pt(s), t, ni, p.tw, p.h - 2 * p.tf, p.pied, p.tete, matiere(0x6d7b8a));
        groupe.add(w);
        if (i < nb && p.blindage) {                                  // blindage jusqu'au fond de la phase
          groupe.add(boite(pt(s + L / nb / 2, -p.h / 2 + p.tf + p.blindage / 2), t, ni, L / nb - p.b, p.blindage,
                           ph.fond, Math.min(p.tete, ph.terrain), matBois));
        }
      }
    }
  }
}

// ----------------------------------------------------------------------------- sol, eau, fond
function sol(ph, groupe) {
  const ext = [[xmin - margeExt, ymin - margeExt], [xmax + margeExt, ymin - margeExt], [xmax + margeExt, ymax + margeExt], [xmin - margeExt, ymax + margeExt]];
  const contourOrd = sens > 0 ? C : [...C].reverse();
  D.couches.forEach((c, i) => {
    const bas = i + 1 < D.couches.length ? D.couches[i + 1].toit : D.z_bas;
    const haut = Math.min(c.toit, ph.terrain);
    const mat = matiere(COULEURS_SOL[i % COULEURS_SOL.length], { transparent: true, opacity: 0.28, depthWrite: false });
    const a = ouvert ? bloc(CT, null, Math.max(bas, ph.fond), haut, mat)      // côté terre d'une coupe ouverte
                     : bloc(ext, contourOrd, Math.max(bas, ph.fond), haut, mat);   // autour de la fouille
    const b = bloc(ext, null, bas, Math.min(haut, ph.fond), mat);             // sous le fond
    for (const m of [a, b]) if (m) { groupe.add(m); groupe.add(new T.LineSegments(new T.EdgesGeometry(m.geometry, 30), new T.LineBasicMaterial({ color: 0x8a7350, transparent: true, opacity: 0.5 }))); }
  });
  const fond = bloc(CF, null, ph.fond - 0.05, ph.fond, matiere(0x8b5a2b));
  if (fond) groupe.add(fond);
}
function eau(ph, groupe) {
  const matEau = matiere(0x3b8fd9, { transparent: true, opacity: 0.35, depthWrite: false });
  const ext = [[xmin - margeExt, ymin - margeExt], [xmax + margeExt, ymin - margeExt], [xmax + margeExt, ymax + margeExt], [xmin - margeExt, ymax + margeExt]];
  if (ph.eau_amont !== null) {
    const trou = ph.eau_amont > ph.fond ? (sens > 0 ? C : [...C].reverse()) : null;
    const m = ouvert ? bloc(CT, null, ph.eau_amont - 0.02, ph.eau_amont, matEau) : bloc(ext, trou, ph.eau_amont - 0.02, ph.eau_amont, matEau); if (m) groupe.add(m);
  }
  if (ph.eau_aval !== null && ph.eau_aval > ph.fond) {
    const m = bloc(CF, null, ph.fond, ph.eau_aval, matiere(0x3b8fd9, { transparent: true, opacity: 0.3, depthWrite: false }));
    if (m) groupe.add(m);
  }
}

// ----------------------------------------------------------------------------- géométrie en plan
function dedans(x, y) {
  let c = false;
  for (let i = 0, j = CF.length - 1; i < CF.length; j = i++) {
    const [xi, yi] = CF[i], [xj, yj] = CF[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function distanceContour(x, y) {
  let best = Infinity;
  for (let k = 0; k < nA; k++) {
    const [x0, y0] = C[k], [x1, y1] = C[(k + 1) % n];
    const L = Math.hypot(x1 - x0, y1 - y0) || 1, tx = (x1 - x0) / L, ty = (y1 - y0) / L;
    const s = Math.min(Math.max((x - x0) * tx + (y - y0) * ty, 0), L);
    best = Math.min(best, Math.hypot(x0 + tx * s - x, y0 + ty * s - y));
  }
  return best;
}
/** Points d'intersection d'une droite du plan (x = x0 ou y = y0) avec le contour, avec la normale intérieure de l'arête. */
function intersectionsContour(axe, v) {
  const out = [];
  for (let k = 0; k < nA; k++) {
    const A = C[k], B = C[(k + 1) % n];
    const a = axe === "x" ? A[0] : A[1], b = axe === "x" ? B[0] : B[1];
    if ((a - v) * (b - v) > 0 || a === b) continue;
    const t = (v - a) / (b - a);
    const P = [A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])];
    const L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1, tt = [(B[0] - A[0]) / L, (B[1] - A[1]) / L];
    out.push({ P, ni: [-tt[1] * sens, tt[0] * sens] });

function couleurGradient(i, ic) {
  const t = Math.min(1, i / (ic || 1));
  return new T.Color().setHSL((1 - t) * 0.33, 0.8, 0.45);  // vert -> rouge
}

// ----------------------------------------------------------------------------- hydraulique
function hydraulique(ph, groupe) {
  const hy = ph.hydro;
  if (!hy) return;
  const ic = hy.i_critique || 1;
  // bouchon
  if (hy.bouchon) {
    const b = hy.bouchon, haut = Math.min(b.toit, ph.fond);
    const m = bloc(CF, null, b.base, haut, matiere(0x7a9a7a, { transparent: true, opacity: 0.55 }));
    if (m) { groupe.add(m); etiquettes.push({ pos: P((xmin + xmax) / 2, (ymin + ymax) / 2, haut), texte: `bouchon ${b.type} (${(haut - b.base).toFixed(1)} m)` }); }
  }
  // surface piézométrique à la cote du fond (charge sous la fouille et dans le massif)
  if (document.getElementById("voirPiezo").checked && hy.charge_fond && hy.charge_fond.h.some((v) => v !== null)) {
    const cf = hy.charge_fond, xs = cf.x, hs = cf.h;
    const hAt = (xl) => {
      let k = 0; while (k < xs.length - 1 && xs[k + 1] < xl) k++;
      const k1 = Math.min(k + 1, xs.length - 1);
      const h0 = hs[k], h1 = hs[k1];
      if (h0 === null && h1 === null) return null;
      if (h0 === null) return h1; if (h1 === null) return h0;
      const t = k1 === k || xs[k1] === xs[k] ? 0 : (xl - xs[k]) / (xs[k1] - xs[k]);
      return h0 + Math.max(0, Math.min(1, t)) * (h1 - h0);
    };
    const pas = Math.max(0.5, taille / 40), x0 = xmin - marge, y0 = ymin - marge;
    const nxg = Math.ceil((xmax + marge - x0) / pas), nyg = Math.ceil((ymax + marge - y0) / pas);
    const pos = [], col = [], idx = [];
    let hmin = Infinity, hmax = -Infinity;
    const vals = [];
    for (let j = 0; j <= nyg; j++) for (let i = 0; i <= nxg; i++) {
      const x = x0 + i * pas, y = y0 + j * pas;
      const d = distanceContour(x, y), xl = dedans(x, y) ? d : -d;
      const h = hAt(xl);
      vals.push(h);
      if (h !== null) { hmin = Math.min(hmin, h); hmax = Math.max(hmax, h); }
    }
    vals.forEach((h, k) => {
      const i = k % (nxg + 1), j = Math.floor(k / (nxg + 1));
      const v = P(x0 + i * pas, y0 + j * pas, h === null ? hmin : h);
      pos.push(v.x, v.y, v.z);
      const t = hmax > hmin ? (h === null ? 0 : (h - hmin) / (hmax - hmin)) : 0.5;
      const c = new T.Color().setHSL(0.6, 0.7, 0.35 + 0.4 * t);
      col.push(c.r, c.g, c.b);
    });
    for (let j = 0; j < nyg; j++) for (let i = 0; i < nxg; i++) {
      const a = j * (nxg + 1) + i, b = a + 1, c2 = a + nxg + 1, d2 = c2 + 1;
      idx.push(a, b, d2, a, d2, c2);
    }
    const g = new T.BufferGeometry();
    g.setAttribute("position", new T.Float32BufferAttribute(pos, 3));
    g.setAttribute("color", new T.Float32BufferAttribute(col, 3));
    g.setIndex(idx); g.computeVertexNormals();
    groupe.add(new T.Mesh(g, new T.MeshLambertMaterial({ vertexColors: true, side: T.DoubleSide, transparent: true, opacity: 0.55, depthWrite: false })));
    etiquettes.push({ pos: P(xmin - marge * 0.6, ymin - marge * 0.6, hAt(-marge * 0.6) ?? hmin), texte: `charge piézométrique à la cote du fond : ${hmin.toFixed(2)} à ${hmax.toFixed(2)} m` });
  }
  // flèches de gradient de sortie au fond de fouille, le long de chaque paroi
  if (document.getElementById("voirGrad").checked && hy.gradient_sortie && hy.gradient_sortie_max > 0) {
    const xs = hy.gradient_sortie_x, gs = hy.gradient_sortie;
    const pasA = Math.max(1, Math.round(xs.length / 8));
    for (let k = 0; k < nA; k++) {
      const A = C[k], B = C[(k + 1) % n], L = Math.hypot(B[0] - A[0], B[1] - A[1]); if (L < 1e-6) continue;
      const t = [(B[0] - A[0]) / L, (B[1] - A[1]) / L], ni = [-t[1] * sens, t[0] * sens];
      const nb = Math.max(1, Math.round(L / Math.max(2, taille / 10)));
      for (let m = 0; m < nb; m++) {
        const sp = (m + 0.5) * L / nb;
        for (let q = 0; q < xs.length; q += pasA) {
          if (xs[q] <= 0 || xs[q] > Math.min(L, taille) / 2) continue;
          const i = gs[q]; if (i <= 0.02 * ic) continue;
          const o = P(A[0] + t[0] * sp + ni[0] * xs[q], A[1] + t[1] * sp + ni[1] * xs[q], ph.fond);
          const lg = 0.12 * H * Math.min(1.5, i / ic);
          groupe.add(new T.ArrowHelper(new T.Vector3(0, 1, 0), o, lg, couleurGradient(i, ic), 0.35 * lg, 0.2 * lg));
        }
      }
    }
    etiquettes.push({ pos: P(C[0][0], C[0][1], ph.fond + 0.15 * H), texte: `gradient de sortie max ${hy.gradient_sortie_max.toFixed(2)} (i_c ≈ ${ic.toFixed(2)})` });
  }
}
/** Équipotentielles sur le plan de coupe actif. */
function equipotentiellesCoupe(ph, groupe) {
  const hy = ph.hydro;
  if (!hy || !hy.equipotentielles || !hy.equipotentielles.length || !voirCoupe.checked) return;
  const t = Number(posCoupe.value) / 1000;
  const axe = axeCoupe.value;
  const v = axe === "x" ? (xmin - marge) + t * (xmax - xmin + 2 * marge) : (ymin - marge) + t * (ymax - ymin + 2 * marge);
  const pts = [];
  for (const { P: Q, ni } of intersectionsContour(axe, v)) {
    for (const eq of hy.equipotentielles) for (const [x0, z0, x1, z1] of eq.segments) {
      if (Math.abs(x0) > marge && Math.abs(x1) > marge) continue;
      const a = P(Q[0] + ni[0] * x0, Q[1] + ni[1] * x0, z0), b = P(Q[0] + ni[0] * x1, Q[1] + ni[1] * x1, z1);
      pts.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
  }
  if (!pts.length) return;
  const g = new T.BufferGeometry();
  g.setAttribute("position", new T.Float32BufferAttribute(pts, 3));
  const l = new T.LineSegments(g, new T.LineBasicMaterial({ color: 0x1f5fae }));
  l.userData.equipotentielles = true;
  groupe.add(l);
}

// ----------------------------------------------------------------------------- appuis
const etiquettes = [];
function appuis(ph, groupe) {
  const matButon = matiere(0x2ca02c), matTirant = matiere(0xc0392b), matLierne = matiere(0x34495e);
  const poses = new Set(ph.appuis);
  const liernesFaites = new Set();
  const etiquetes = new Set();
  for (const pa of D.plan_appuis) {
    const a = D.appuis[pa.appui];
    if (!a || !poses.has(pa.appui)) continue;
    const de = P(pa.de[0], pa.de[1], a.cote);
    let fin;
    if (a.type === "buton") {
      fin = P(pa.a[0], pa.a[1], a.cote);
      const m = cylindre(de, fin, a.D / 2, matButon.clone()); m.userData.appui = pa.appui; groupe.add(m);
    } else if (a.type === "bracon") {
      fin = P(pa.a[0], pa.a[1], a.pied_bracon ?? ph.fond);
      const m = cylindre(de, fin, a.D / 2, matButon.clone()); m.userData.appui = pa.appui; groupe.add(m);
    } else if (a.type === "tirant") {
      const Ll = a.longueur_libre || 8, Ls = a.longueur_scellee || 6, i = (a.angle || 0) * Math.PI / 180;
      const dx = pa.a[0] - pa.de[0], dy = pa.a[1] - pa.de[1], Lh = Math.hypot(dx, dy) || 1;
      const u = [dx / Lh, dy / Lh];
      const pnt = (L) => P(pa.de[0] + u[0] * L * Math.cos(i), pa.de[1] + u[1] * L * Math.cos(i), a.cote - L * Math.sin(i));
      const m1 = cylindre(de, pnt(Ll), 0.05, matTirant.clone()); m1.userData.appui = pa.appui; groupe.add(m1);
      const m2 = cylindre(pnt(Ll), pnt(Ll + Ls), 0.12, matTirant.clone()); m2.userData.appui = pa.appui; groupe.add(m2);
      fin = pnt(Ll + Ls);
    }
    if (fin && !etiquetes.has(pa.appui)) {                    // une étiquette par appui
      etiquetes.add(pa.appui);
      etiquettes.push({ pos: de.clone().lerp(fin, 0.5), texte: `${pa.appui}${a.element ? " — " + a.element : ""}` });
    }
    if (a.lierne && !liernesFaites.has(pa.appui)) {
      liernesFaites.add(pa.appui);
      for (let k = 0; k < nA; k++) {
        const A = C[k], B = C[(k + 1) % n], L = Math.hypot(B[0] - A[0], B[1] - A[1]);
        if (L < 1e-6) continue;
        const t = [(B[0] - A[0]) / L, (B[1] - A[1]) / L], ni = [-t[1] * sens, t[0] * sens];
        const o = (D.paroi.type === "paroi_moulee" ? D.paroi.epaisseur / 2 : D.paroi.type.startsWith("pieux") ? D.paroi.diametre / 2 : D.paroi.h / 2) + 0.2;
        const c = [(A[0] + B[0]) / 2 + ni[0] * o, (A[1] + B[1]) / 2 + ni[1] * o];
        groupe.add(boite(c, t, ni, L, 0.3, a.cote - 0.15, a.cote + 0.15, matLierne));
      }
      etiquettes.push({ pos: P(C[0][0], C[0][1], a.cote + 0.4), texte: `lierne ${a.lierne}` });
    }
  }
  for (const [nom, a] of Object.entries(D.appuis)) {          // dalles : sur toute la fouille
    if (a.type === "dalle" && poses.has(nom)) {
      const m = bloc(C, null, a.cote - (a.epaisseur || 0.3) / 2, a.cote + (a.epaisseur || 0.3) / 2, matiere(0xbdbdbd));
      if (m) { m.userData.appui = nom; groupe.add(m); etiquettes.push({ pos: P((xmin + xmax) / 2, (ymin + ymax) / 2, a.cote + 0.3), texte: `${nom} (dalle)` }); }
    }
  }
}

// ----------------------------------------------------------------------------- phases
const curseur = document.getElementById("curseur"), selMode = document.getElementById("mode");
const voirSol = document.getElementById("voirSol"), voirEau = document.getElementById("voirEau");
curseur.max = String(D.phases.length - 1);
curseur.value = String(D.phases.length - 1);
document.getElementById("titre").textContent = D.projet;
document.getElementById("avert").textContent = (D.plan_defaut ? (D.note_plan || "Sans tracé en plan : coupe 2D infinie. Le tracé réel se saisit dans l'étape Géométrie.") + " " : "")
  + (D.p3d ? "Couleurs : champ pseudo-3D." : "Couleurs : profil du calcul 2D, identique sur tout le linéaire.");
D.phases.forEach((p, i) => (p.index = i));
let groupe = null;

function bornes(mode) {
  let lo = Infinity, hi = -Infinity;
  for (const p of D.phases) {
    if (D.p3d && D.p3d.phases && D.p3d.phases[p.index] && D.p3d.phases[p.index].ok) {
      const q = D.p3d.phases[p.index], g = mode === "M" ? q.M : q.y_mm;
      if (g) for (const r of g) for (const v of r) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    } else if (p.profil) {
      for (const v of mode === "M" ? p.profil.M : mode === "u" ? p.profil.u_amont : p.profil.y_mm) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    }
  }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  if (hi - lo < 1e-9) hi = lo + 1;
  return { min: lo, max: hi };
}

// ----------------------------------------------------------------------------- plan de coupe
const voirCoupe = document.getElementById("voirCoupe"), axeCoupe = document.getElementById("axeCoupe"),
      posCoupe = document.getElementById("posCoupe");
const planCoupe = new T.Plane(new T.Vector3(-1, 0, 0), 0);
function majCoupe() {
  posCoupe.disabled = !voirCoupe.checked;
  const t = Number(posCoupe.value) / 1000;
  if (axeCoupe.value === "x") {
    planCoupe.normal.set(-1, 0, 0);
    planCoupe.constant = (xmin - marge) + t * (xmax - xmin + 2 * marge);          // garde x ≤ x0
  } else {
    planCoupe.normal.set(0, 0, 1);
    planCoupe.constant = (ymin - marge) + t * (ymax - ymin + 2 * marge);          // garde y ≤ y0
  }
  if (groupe) groupe.traverse((o) => {
    if (o.material && !o.userData.equipotentielles) { o.material.clippingPlanes = voirCoupe.checked ? [planCoupe] : null; o.material.needsUpdate = true; }
  });
  if (groupe) {
    const anciennes = groupe.children.filter((o) => o.userData.equipotentielles);
    for (const o of anciennes) { groupe.remove(o); o.geometry.dispose(); }
    equipotentiellesCoupe(D.phases[Number(curseur.value)], groupe);
  }
}
for (const el of [voirCoupe, axeCoupe]) el.addEventListener("change", majCoupe);
posCoupe.addEventListener("input", majCoupe);

// ----------------------------------------------------------------------------- vues prédéfinies
function vue(nom) {
  if (nom === "iso") { theta = -0.9; phi = 0.95; }
  else if (nom === "face") { theta = Math.PI / 2; phi = Math.PI / 2 - 0.05; }
  else if (nom === "dessus") { theta = Math.PI / 2; phi = 0.02; }
  else if (nom === "coupe") {
    voirCoupe.checked = true; axeCoupe.value = "x"; posCoupe.value = "500"; majCoupe();
    theta = 0; phi = Math.PI / 2 - 0.05;
  }
  document.querySelectorAll("[data-vue]").forEach((b) => b.classList.toggle("actif", b.dataset.vue === nom));
  placerCamera();
}
document.querySelectorAll("[data-vue]").forEach((b) => b.addEventListener("click", () => vue(b.dataset.vue)));

// ----------------------------------------------------------------------------- sélection d'un appui
const lanceur = new T.Raycaster();
let depart = null, selectionne = null;
rendu.domElement.addEventListener("pointerdown", (e) => { depart = { x: e.clientX, y: e.clientY }; });
rendu.domElement.addEventListener("pointerup", (e) => {
  if (!depart || Math.hypot(e.clientX - depart.x, e.clientY - depart.y) > 4 || e.button !== 0) return;
  const r = rendu.domElement.getBoundingClientRect();
  lanceur.setFromCamera(new T.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const touches = lanceur.intersectObjects(groupe ? groupe.children : [], true).filter((t) => t.object.userData.appui);
  selectionner(touches.length ? touches[0].object.userData.appui : null, true);
});
function selectionner(nom, notifier) {
  selectionne = nom;
  if (groupe) groupe.traverse((o) => {
    if (o.userData.appui && o.material && o.material.emissive) o.material.emissive.setHex(o.userData.appui === nom ? 0x664400 : 0x000000);
  });
  const a = nom ? D.appuis[nom] : null;
  document.getElementById("selection").textContent = a
    ? `Sélection : ${nom} — ${a.type}${a.element ? ", " + a.element : ""}, cote ${a.cote} m, espacement ${a.espacement} m` : "";
  if (notifier && window.parent !== window) window.parent.postMessage({ source: "retainwall-3d", type: "selection", appui: nom }, "*");
}

// ----------------------------------------------------------------------------- dialogue avec l'application
window.addEventListener("message", (e) => {
  const m = e.data || {};
  if (m.source !== "retainwall") return;
  if (m.type === "phase" && m.index >= 0 && m.index < D.phases.length && String(m.index) !== curseur.value) {
    curseur.value = String(m.index); afficher(m.index);
  } else if (m.type === "theme") {
    document.body.classList.toggle("sombre", !!m.sombre);
    scene.background = new T.Color(m.sombre ? 0x161b22 : 0xeef1f5);
  } else if (m.type === "selection") {
    selectionner(m.appui, false);
  } else if (m.type === "image") {
    rendu.render(scene, camera);
    window.parent.postMessage({ source: "retainwall-3d", type: "image", url: rendu.domElement.toDataURL("image/png") }, "*");
  }
});
function notifierPhase(i) {
  if (window.parent !== window) window.parent.postMessage({ source: "retainwall-3d", type: "phase", index: i }, "*");
}

function afficher(i) {
  const ph = D.phases[i];
  document.getElementById("nomPhase").textContent = `Phase ${i + 1}/${D.phases.length} : ${ph.nom}` + (ph.ok ? "" : " (non calculée)");
  if (groupe) { scene.remove(groupe); groupe.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
  groupe = new T.Group();
  etiquettes.length = 0;
  const mode = selMode.value;
  if (mode) {
    echelle = { ...bornes(mode), titre: mode === "M" ? "Moment (kN·m/m), toutes phases" : mode === "u" ? "Pression d'eau amont (kPa), toutes phases" : "Déplacement y (mm), toutes phases" };
    document.getElementById("titreEchelle").textContent = echelle.titre;
    document.getElementById("vmin").textContent = echelle.min.toFixed(1);
    document.getElementById("vmax").textContent = echelle.max.toFixed(1);
  }
  document.getElementById("legende").style.display = mode ? "" : "none";
  paroi(ph, mode, groupe);
  if (voirSol.checked) sol(ph, groupe);
  else { const f = bloc(C, null, ph.fond - 0.05, ph.fond, matiere(0x8b5a2b)); if (f) groupe.add(f); }
  if (voirEau.checked) eau(ph, groupe);
  appuis(ph, groupe);
  document.getElementById("ligneHydro").style.display = ph.hydro ? "" : "none";
  hydraulique(ph, groupe);
  equipotentiellesCoupe(ph, groupe);
  scene.add(groupe);
  majCoupe();
  selectionner(selectionne, false);
}
for (const id of ["voirPiezo", "voirGrad"]) document.getElementById(id).addEventListener("change", () => afficher(Number(curseur.value)));
curseur.addEventListener("input", () => { afficher(Number(curseur.value)); notifierPhase(Number(curseur.value)); });
document.getElementById("prec").onclick = () => { curseur.value = String(Math.max(0, Number(curseur.value) - 1)); afficher(Number(curseur.value)); notifierPhase(Number(curseur.value)); };
document.getElementById("suiv").onclick = () => { curseur.value = String(Math.min(D.phases.length - 1, Number(curseur.value) + 1)); afficher(Number(curseur.value)); notifierPhase(Number(curseur.value)); };
for (const el of [selMode, voirSol, voirEau]) el.addEventListener("change", () => afficher(Number(curseur.value)));

// ----------------------------------------------------------------------------- boucle
const coucheEtiquettes = document.getElementById("etiquettes");
function redimensionner() {
  const w = window.innerWidth, h = window.innerHeight;
  rendu.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", redimensionner);
function boucle() {
  rendu.render(scene, camera);
  coucheEtiquettes.innerHTML = "";
  for (const e of etiquettes) {
    const v = e.pos.clone().project(camera);
    if (v.z > 1) continue;
    const d = document.createElement("div");
    d.className = "etiquette";
    d.style.left = `${(v.x + 1) / 2 * window.innerWidth}px`;
    d.style.top = `${(1 - v.y) / 2 * window.innerHeight}px`;
    d.textContent = e.texte;
    coucheEtiquettes.appendChild(d);
  }
  requestAnimationFrame(boucle);
}
redimensionner();
placerCamera();
afficher(D.phases.length - 1);
boucle();
</script>
</body>
