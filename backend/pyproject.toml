[project]
name = "sout"
version = "0.1.0"
description = "RetainWall : calcul d'écrans de soutènement par coefficients de réaction"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "ruamel.yaml>=0.18",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
rapport = ["matplotlib>=3.8"]   # figures du rapport docs/validation (python -m outils.rafale_elementaire)

[tool.setuptools.packages.find]
include = ["sout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "validation: cas de validation contre K-Réa / RIDO (tolérance 5 %)",
]
