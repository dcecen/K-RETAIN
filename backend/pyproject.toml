[project]
name = "sout"
version = "0.1.0"
description = "K-Retain : calcul d'écrans de soutènement par coefficients de réaction"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "ruamel.yaml>=0.18",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
rapport = ["matplotlib>=3.8"]   # figures du rapport docs/validation (python -m outils.rafale_elementaire)
dev = ["ruff>=0.8"]             # qualité du code (lancer_tests.ps1 l'exécute s'il est installé)

[tool.setuptools.packages.find]
include = ["sout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "validation: cas de validation contre K-Réa / RIDO (tolérance 5 %)",
  "lent: test de plus de 30 s (à exclure avec -m 'not lent' pendant le développement)",
]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# E : style, F : erreurs probables (imports/variables inutilisés…), B : pièges courants, UP : syntaxe moderne,
# BLE : « except Exception » qui avalent les erreurs. Les lignes longues et les instructions sur une ligne
# (« a = 1; b = 2 ») font partie du style du dépôt : non signalées.
select = ["E", "F", "B", "UP", "BLE"]
ignore = ["E501", "E701", "E702", "E741", "E743", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
