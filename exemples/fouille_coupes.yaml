# Projet à plusieurs coupes de calcul 2D (valeurs d'illustration, jeu DEMO de la base matériaux).
# Chaque coupe hérite de ce script et ne redéfinit que ce qui change (bloc script de la coupe).
# Le petit côté ouest est volontairement laissé sans coupe : la maquette le montre en gris hachuré
# et le calcul émet un avertissement.
projet: Fouille à trois coupes
calcul:
  methode: coefficients_reaction
  kh: schmitt
  norme: NF P 94-282

paroi:
  type: palplanche
  profil: AZ 26-700
  acier: S355GP
  tete: 0.0
  pied: -14.0

sol:
  - { nom: Remblai, toit: 0.0, gamma: 18, gamma_dejauge: 9, phi: 28, c: 0, EM: 4000, alpha: 0.5 }
  - { nom: Sable dense, toit: -3.0, gamma: 20, gamma_dejauge: 11, phi: 35, c: 0, EM: 15000, alpha: 0.33 }

eau:
  service: { amont: -2.0, aval: -2.0 }

surcharges:
  - { nom: chantier, type: bande, q: 20, distance: 1.0, largeur: 5.0 }
  - { nom: grue, type: ponctuelle, q: 1200, position: [15, -8], emprise: [6, 6], profondeur: 0.5, phases: [2, 3] }   # existe de la phase 2 à la phase 3
  - { nom: stockage, type: rectangulaire, q: 40, position: [38, 9], emprise: [10, 8], phase: 2 }                    # à partir de la phase 2
  - { nom: immeuble, type: bande, q: 90, distance: 3.5, largeur: 18, emprise: { de: 4, a: 26 }, cote_paroi: long_nord, profondeur: 2.0, niveaux: 6 }

appuis:
  B1: { type: buton, element: modulaire_A, cote: -1.5, espacement: 6.0, longueur: 18.0, precharge: 50 }

fouille:
  risbermes:                                        # risberme contre le côté sud pendant la phase 3 (surcharge équivalente)
    - { nom: R1, cote_paroi: long_sud, phases: [3, 3], cote_crete: -4.0, largeur_crete: 2.0, pente: 1.5, cote_pied: -6.5 }

plan:
  contour: [[0, 0], [30, 0], [30, 18], [0, 18]]
  cotes: { long_sud: 0, court_est: 1, long_nord: 2, court_ouest: 3 }   # noms des côtés (numéro d'arête du contour)

phases:
  - { nom: "Terrassement à -2,0", excaver: -2.0 }
  - { nom: Pose du buton B1, poser: B1 }
  - { nom: Terrassement final et pompage, excaver: -6.5, eau: { aval: -7.0 } }

verifications: [butee, equilibre_vertical, fond_de_fouille, stabilite_generale, structure]

coupes:
  - nom: C1 — long côté sud
    zone: { paroi: long_sud }                       # tout le côté
  - nom: C2 — long côté nord, sous voirie
    zone: { paroi: long_nord }
    trace: { de: [15, 30], a: [15, 9] }             # trace en plan (facultative : par défaut, perpendiculaire au milieu du tronçon)
    script:                                         # données locales : sol plus faible et surcharge de voirie
      sol:
        - { nom: Remblai hétérogène, toit: 0.0, gamma: 18, gamma_dejauge: 9, phi: 24, c: 0, EM: 3000, alpha: 0.5 }
        - { nom: Sable, toit: -3.0, gamma: 20, gamma_dejauge: 11, phi: 30, c: 0, EM: 9000, alpha: 0.33 }
      surcharges:
        - { nom: voirie, type: bande, q: 30, distance: 0.5, largeur: 8.0 }
  - nom: C3 — petit côté est, fouille moins profonde
    zone: { paroi: court_est }
    script:
      fouille: { risbermes: [] }                    # pas de risberme sur ce côté
      phases:
        - { nom: "Terrassement à -2,0", excaver: -2.0 }
        - { nom: Pose du buton B1, poser: B1 }
        - { nom: Terrassement final sans pompage, excaver: -5.0 }
