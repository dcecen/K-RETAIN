# Exemple du cahier des charges (projet fictif, valeurs d'illustration).
# Utilise la base matériaux (jeu DEMO). Ne pas utiliser pour un projet réel.
projet: Fouille exemple
calcul:
  methode: coefficients_reaction
  kh: schmitt
  norme: NF P 94-282

paroi:
  type: palplanche
  profil: AZ 26-700        # référence de la base matériaux
  acier: S355GP
  tete: 0.0
  pied: -14.0

sol:
  - nom: Remblai
    toit: 0.0
    gamma: 18
    gamma_dejauge: 9
    phi: 28
    c: 0
    EM: 4000
    alpha: 0.5
  - nom: Sable dense
    toit: -3.0
    gamma: 20
    gamma_dejauge: 11
    phi: 35
    c: 0
    EM: 15000
    alpha: 0.33

eau:
  service: { amont: -2.0, aval: -2.0 }

surcharges:
  - { type: bande, q: 20, distance: 1.0, largeur: 5.0 }

appuis:
  B1: { type: buton, element: modulaire_A, cote: -1.5, espacement: 6.0, longueur: 18.0, precharge: 50 }

phases:
  - nom: Terrassement à -2,0
    excaver: -2.0
  - nom: Pose du buton B1
    poser: B1
  - nom: Terrassement final et pompage
    excaver: -6.5
    eau: { aval: -7.0 }

verifications: [butee, equilibre_vertical, fond_de_fouille, stabilite_generale, structure]

assemblages:                       # dessinés et vérifiés avec les efforts du calcul (onglet Assemblages)
  A1: { type: platine_about, appui: B1, lierne: HEB 400, acier: S355, parametres: { t_platine: 30, b_platine: 700, h_platine: 400 } }
  A2: { type: chaise_buton, appui: B1, lierne: HEB 400, acier: S355 }
  A3: { type: raidisseurs_lierne, appui: B1, lierne: HEB 400, acier: S355 }
