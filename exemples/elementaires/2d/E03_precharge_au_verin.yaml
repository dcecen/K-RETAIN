# VÉRIFICATION ÉLÉMENTAIRE E03 — précharge d'un buton mise en charge au vérin
# Convention K-Réa : à la fin de la phase de pose seule, le buton porte exactement sa précharge ;
# l'excavation suivante le charge ensuite élastiquement.
# ATTENDU : effort de B1 après « Pose et précharge » = 50 kN/m (précharge 300 kN / espacement 6 m) ;
# effort final > 50 kN/m ; équilibre des forces (sol + eau + appui) nul à chaque phase.
# SOURCE : convention K-Réa de la mise en charge au vérin (effort = précharge à la fin de la phase de pose) ;
# statique (somme des forces horizontales nulle).
projet: E03 Précharge au vérin — effort après la pose = 50 kN/m
calcul: { kh: impose, pas: 0.1 }
paroi: { type: palplanche, EI: 1.0e5, tete: 0.0, pied: -12.0 }
sol:
  - { nom: Sable, toit: 0.0, gamma: 20, gamma_dejauge: 10, phi: 32, kh: 20000 }
eau:
  service: { amont: -3.0, aval: -3.0 }
appuis:
  B1: { type: buton, raideur: 30000, cote: -1.0, espacement: 6.0, precharge: 300 }
phases:
  - { nom: "Terrassement à -2,0", excaver: -2.0 }
  - { nom: Pose et précharge, poser: B1 }
  - { nom: "Terrassement final à -6,0 et pompage", excaver: -6.0, eau: { aval: -6.5 } }
verifications: [butee, equilibre_vertical, stabilite_generale, fond_de_fouille]
