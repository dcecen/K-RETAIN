# VÉRIFICATION ÉLÉMENTAIRE E05 — pseudo-3D, vraie plaque (inertie 3D de la paroi)
# Même paroi que E04 mais plaque isotrope (Ds = Dz, torsion de Huber) : la paroi répartit la poussée
# entre les butons. Loin des bords, une paroi très longue doit retrouver le calcul 2D à appui réparti.
# ATTENDU : effort moyen d'un buton intérieur = effort 2D × espacement (à 5 %) ; déplacement quasi
# uniforme le long de la paroi (max/min < 1,3), très inférieur à celui de E04.
# SOURCE : plaque isotrope sur ressorts (Timoshenko & Woinowsky-Krieger, Theory of Plates and Shells ; grillage
# de Hambly) : loin des bords, une paroi longue à appuis régulièrement espacés tend vers l'écran 2D à appui réparti.
projet: E05 Pseudo-3D plaque isotrope — effort par buton = H 2D × e
calcul: { mode: pseudo3d, kh: impose, pas: 0.25 }
pseudo3d: { longueur: 48, pas_horizontal: 1.0, rapport_rigidite_horizontale: 1.0 }
paroi: { type: paroi_moulee, EI: 1.0e5, tete: 0.0, pied: -12.0 }
sol:
  - { nom: Sable, toit: 0.0, gamma: 20, gamma_dejauge: 10, phi: 32, kh: 20000 }
appuis:
  B: { type: buton, raideur: 30000, cote: -1.0, espacement: 4.0, precharge: 80 }
phases:
  - { nom: "Terrassement à -2,0", excaver: -2.0 }
  - { nom: Pose des butons, poser: B }
  - { nom: "Terrassement à -6,0", excaver: -6.0 }
