# VÉRIFICATION ÉLÉMENTAIRE E23 — lierne en poutre continue sur les butons
# Butons tous les 4 m sur une lierne HEB 400 (S355). La lierne reprend la réaction de la paroi q (kN/m, effort du
# buton par mètre d'écran) en poutre continue sur deux travées (cas défavorable) : M = q·e²/8 et V = 0,625·q·e,
# puis efforts de calcul = γ_effets × ces valeurs.
# ATTENDU (vérification « Lierne — flexion bi-axiale et cisaillement ») : My = γ_effets·q·e²/8 et V = γ_effets·0,625·q·e
# avec q = effort maximal du buton ; V/My = 5/e = 1,25 /m (1 %).
# SOURCE : poutre continue sur deux travées égales (RDM : M sur appui = q·e²/8, réaction d'appui central 1,25·q·e) ;
# EN 1993-1-1 § 6.2.5 et § 6.2.6 pour les résistances.
