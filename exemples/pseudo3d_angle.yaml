# Projet fictif, valeurs d'illustration. Calcul pseudo-3D : deux parois de 24 m se
# rejoignant à angle droit (angle au milieu de la longueur développée de 48 m).
projet: Paroi moulée avec angle (pseudo-3D, exemple)
calcul:
  mode: pseudo3d
  pas: 0.25

pseudo3d:
  longueur: 48          # longueur développée modélisée (m)
  pas_horizontal: 1.0
  bords: libres
  angle: 90             # angle de fouille au milieu (s = 24 m)

paroi:
  type: paroi_moulee
  epaisseur: 0.6
  beton: C30/37
  rapport_EI_fissure: 0.7   # choix d'illustration
  enrobage: 0.07
  tete: 0.0
  pied: -16.0

sol:
  - { nom: Remblai, toit: 0.0, gamma: 18, gamma_dejauge: 9, phi: 28, EM: 5000, alpha: 0.5 }
  - { nom: Marne, toit: -3.0, gamma: 20, gamma_dejauge: 10, phi: 30, c: 15, EM: 30000, alpha: 0.5, pl: 2500 }

eau:
  service: { amont: -3.0, aval: -3.0 }

appuis:
  B1: { type: buton, element: modulaire_A, cote: -1.0, espacement: 6.0, longueur: 20.0, precharge: 100, lierne: HEB 400 }

plan:
  contour: [[0, 0], [24, 0], [24, 24], [0, 24]]

phases:
  - { nom: "Terrassement à -1,5", excaver: -1.5 }
  - { nom: Pose du buton B1, poser: B1 }
  - { nom: Terrassement final et pompage, excaver: -8.0, eau: { aval: -8.5 } }

verifications: [butee, stabilite_generale, deplacements, structure]
criteres: { deplacement_max_mm: 25 }
