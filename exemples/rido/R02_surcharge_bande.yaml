# Script converti depuis RIDO (R02_surcharge_bande.rid) : R02 IPE400 esp 2.1m sable + surcharge de bande
# Lecture du format : docs/rido/correspondance.yaml (interprétations à confirmer). Vérifiez chaque bloc.
# Commentaire RIDO : Cas de démonstration K-Retain / RIDO : sol fictif, valeurs d'illustration
# Commentaire RIDO : R01 avec la surcharge du fichier fourni : sub(1) TN 0.50 10.5 5
# Commentaire RIDO : Fichier indépendant de toute feuille Excel (structure du fichier RIDO fourni)
# Commentaire RIDO : Autostable
# Commentaire RIDO : Provisoire
# Commentaire RIDO : Profilé IPE400 : I en cm4, h et b en m, W en cm3
# Commentaire RIDO : Couche 1 : Sable
# Commentaire RIDO : fap
# Commentaire RIDO : fap
# Non repris : ligne 59 : « bIL » après « fin », ignorée
# Non repris : ligne 60 : « stop » après « fin », ignorée
# Non repris : ligne 19 : 2e valeur de la ligne de tête (0), sens inconnu
# Non repris : ligne 20 : valeurs 0, 1160 de la section d'écran (après cote et EI), sens inconnu
# Non repris : ligne 40 : 2e valeur de la ligne de nappe (0,05), sens inconnu
# Calcul non repris : « Phase 1 - MEL » (ligne 51) : calcul à l'équilibre limite (tel) ; K-Retain fait ses propres vérifications ELU (docs/normes)
# Calcul non repris : « Phase 1 - ELU » (ligne 57) : calcul pondéré (fap) ; K-Retain fait ses propres vérifications ELU (docs/normes)
# Hypothèse : EI en kN·m²/m et par mètre d'écran (EI = 2,1·I/esp dans le fichier fourni)
# Hypothèse : couches : base, gamma, gamma_dejauge, ka, k0, kp, phi, c, delta_a, delta_p, kh (docs/rido/correspondance.yaml, à confirmer)
# Hypothèse : ka, k0, kp nuls = calcul automatique ; K-Retain : Ka, Kp de Coulomb (Rankine si δ = 0), K0 de Jaky
# Hypothèse : nappe au même niveau des deux côtés, régime hydrostatique, écran étanche (pressions d'eau des deux côtés comme données)
# Hypothèse : ligne 42 : sub = bande de Boussinesq (cote, debut, fin, q) appliquée à la phase 1
# Hypothèse : ligne 43 : coe = pressions et kh multipliés par 0,466667 entre 128,6 et 133,6 m, des deux côtés
projet: R02 IPE400 esp 2.1m sable + surcharge de bande
calcul: {kh: impose}
paroi:
  type: berlinoise
  tete: 136.6
  pied: 128.6
  EI: 23130.0
  etancheite: etanche
  coefficients_largeur:
  - {haut: 133.6, bas: 128.6, rapport: 0.466667}
sol:
- {nom: Couche 1, toit: 136.6, gamma: 19.0, gamma_dejauge: 10.0, phi: 32.0, c: 0.0, delta_a_sur_phi: 0.0, 
    delta_p_sur_phi: 0.0, kh: 13171.9}
eau:
  rido: {amont: 120.0, aval: 120.0}
surcharges:
- {nom: sub1, type: bande, q: 5.0, distance: 0.5, largeur: 10.0, cote: 136.6, cote_ecran: amont, phase: 1}
phases:
- {nom: Phase 1 - Excavation à FF, excaver: 133.6}
