# Paramètres normatifs du module hydraulique. Les coefficients UPL/HYD et le gradient admissible
# sont dans nf_p94_282.yaml (bloc fond_de_fouille).
# STATUT : valeurs saisies par Claude de mémoire (22 octobre 2026), À CONFIRMER. Modèle vide : modeles/hydraulique.yaml.

terzaghi:
  F_min: { valeur: 2.0, source: "PRATIQUE : facteur de sécurité usuel contre le renard par la méthode de Terzaghi, 1,5 à 2,0 (valeur prudente retenue) — à confirmer" }

# Rapport de cheminement pondéré minimal C_Lane = L_w / H (Lane, 1935, Trans. ASCE 100, table des « weighted creep ratios »)
lane:
  C:
    sable_tres_fin_ou_limon: { valeur: 8.5, source: "Lane (1935), table — de mémoire, à confirmer" }
    sable_fin: { valeur: 7.0, source: "Lane (1935), table — de mémoire, à confirmer" }
    sable_moyen: { valeur: 6.0, source: "Lane (1935), table — de mémoire, à confirmer" }
    sable_grossier: { valeur: 5.0, source: "Lane (1935), table — de mémoire, à confirmer" }
    gravier_fin: { valeur: 4.0, source: "Lane (1935), table — de mémoire, à confirmer" }
    gravier_moyen: { valeur: 3.5, source: "Lane (1935), table — de mémoire, à confirmer" }
    gravier_grossier: { valeur: 3.0, source: "Lane (1935), table (graviers grossiers et galets) — de mémoire, à confirmer" }
    argile_molle: { valeur: 3.0, source: "Lane (1935), table — de mémoire, à confirmer" }
    argile_moyenne: { valeur: 2.0, source: "Lane (1935), table — de mémoire, à confirmer" }
    argile_raide: { valeur: 1.8, source: "Lane (1935), table — de mémoire, à confirmer" }

bouchon:
  gradient_admissible: { valeur: 3.0, source: "PROJET : gradient maximal admis à travers un bouchon injecté ou de jet-grouting (usage courant 3 à 5 selon le traitement) — à fixer par projet" }

fond_argile:
  N_c: { valeur: 5.7, source: "Terzaghi (1943) : Nc = 5,7 pour φ = 0 (fouille longue) ; Bjerrum & Eide (1956) donnent 5,7 à 9 selon H/B et L/B — valeur prudente, à confirmer selon la géométrie" }
  F_min: { valeur: 1.5, source: "PRATIQUE : facteur de sécurité usuel sur la stabilité du fond en argile molle (1,5) — à confirmer" }
