# Extraits de la NF P 94-282 (mars 2009) et de l'EN 1997-1 avec annexe nationale, utilisés par RetainWall.
#
# STATUT : valeurs saisies par Claude de mémoire à la demande de l'utilisateur (22 octobre 2026),
# À CONFIRMER sur le texte de la norme par un ingénieur avant tout usage en projet. Chaque
# valeur indique l'article dont elle est issue de mémoire ; « projet » signale une valeur qui
# dépend du projet et non de la norme. Le modèle vide est dans modeles/nf_p94_282.yaml.

approche_de_calcul: { valeur: "Approche 2 (écrans de soutènement), calcul MISS aux coefficients de réaction", source: "NF P 94-282 § 7 ; EN 1997-1 § 2.4.7.3.4.3 — de mémoire, à confirmer" }

# Coefficients appliqués aux effets des actions calculés aux ELS caractéristiques (M, V, efforts d'appui)
combinaisons:
  ELU_fondamental:
    gamma_effets: { valeur: 1.35, source: "NF P 94-282 § 9.1, approche 2 (γF sur les effets des actions) — de mémoire, à confirmer" }
  ELU_accidentel:
    gamma_effets: { valeur: 1.0, source: "NF P 94-282 § 9.1, combinaisons accidentelles — de mémoire, à confirmer" }
  ELS_caracteristique:
    gamma_effets: { valeur: 1.0, source: "NF P 94-282 § 10 — de mémoire, à confirmer" }

# Mobilisation de la butée : gamma_effet × Bm ≤ Bt / (gamma_R_e × gamma_R_d)
butee:
  gamma_effet: { valeur: 1.35, source: "NF P 94-282 § 9.2.3 — de mémoire, à confirmer" }
  gamma_R_e: { valeur: 1.4, source: "NF P 94-282 § 9.2.3, tableau des coefficients partiels sur la butée (situations durables et transitoires) — de mémoire, à confirmer" }
  gamma_R_d: { valeur: 1.1, source: "NF P 94-282 § 9.2.3, coefficient de modèle pour la méthode MISS — de mémoire, à confirmer" }

# Équilibre vertical de l'écran (portance de pointe et frottement selon NF P 94-262)
equilibre_vertical:
  gamma_effet: { valeur: 1.35, source: "NF P 94-282 § 9.3 — de mémoire, à confirmer" }
  gamma_b: { valeur: 1.1, source: "NF P 94-262 § 14.2.1.1, ELU fondamental, pointe — de mémoire, à confirmer" }
  gamma_s: { valeur: 1.1, source: "NF P 94-262 § 14.2.1.1, ELU fondamental, frottement — de mémoire, à confirmer" }
  gamma_R_d: { valeur: 1.15, source: "NF P 94-262 § 14.2.1.1, coefficient de modèle de la méthode pressiométrique (hors essais de chargement) — de mémoire, à confirmer" }
  k_p: { valeur: 1.1, source: "NF P 94-262 annexe F, facteur de portance pressiométrique pour un écran (classe de pieu paroi/barrette) : ordre de grandeur, dépend de la classe de sol et de l'élancement — à confirmer sur l'annexe F" }
  coefficient_qs: { valeur: 0.025, source: "ORDRE DE GRANDEUR : qs ≈ 0,025·pl plafonné (courbes Q1–Q3 de l'annexe F de la NF P 94-262 pour sables et argiles) — simplification RetainWall, à remplacer par les courbes de l'annexe F" }

# Stabilité du massif d'ancrage (Kranz)
kranz:
  gamma_effet: { valeur: 1.35, source: "NF P 94-282 § 9.5 — de mémoire, à confirmer" }
  gamma_R: { valeur: 1.1, source: "NF P 94-282 § 9.5 (coefficient partiel sur la résistance du massif d'ancrage) — de mémoire, à confirmer" }

# Fond de fouille (EN 1997-1 annexe A, annexe nationale française)
fond_de_fouille:
  soulevement:                                        # UPL, EN 1997-1 § 2.4.7.4
    gamma_dst: { valeur: 1.0, source: "EN 1997-1 annexe A, tableau A.15 (γG;dst, permanentes défavorables) — de mémoire, à confirmer" }
    gamma_stb: { valeur: 0.9, source: "EN 1997-1 annexe A, tableau A.15 (γG;stb, permanentes favorables) — de mémoire, à confirmer" }
  boulance:                                           # HYD, EN 1997-1 § 2.4.7.5
    gamma_dst: { valeur: 1.35, source: "EN 1997-1 annexe A, tableau A.17 (γG;dst) — de mémoire, à confirmer" }
    gamma_stb: { valeur: 0.9, source: "EN 1997-1 annexe A, tableau A.17 (γG;stb) — de mémoire, à confirmer" }
  renard:
    gradient_admissible: { valeur: 0.5, source: "PRATIQUE : gradient de sortie admissible i ≤ i_c/2 (i_c = γ'/γw ≈ 1) — usage courant, dépend du sol, à confirmer (NF P 94-282 § 9.6)" }

# Stabilité générale (approche 3, jeu M2 ; coefficient de modèle sur le facteur de sécurité)
stabilite_generale:
  gamma_phi: { valeur: 1.25, source: "EN 1997-1 annexe A, tableau A.4, jeu M2 (sur tan φ') — de mémoire, à confirmer" }
  gamma_c: { valeur: 1.25, source: "EN 1997-1 annexe A, tableau A.4, jeu M2 (sur c') — de mémoire, à confirmer" }
  gamma_R_d: { valeur: 1.0, source: "NF P 94-282 § 9.4 (coefficient de modèle sur la stabilité générale ; 1,0 avec M2 pour une méthode de tranches classique) — de mémoire, à confirmer" }
  gamma_Q: { valeur: 1.3, source: "EN 1997-1 annexe A, tableau A.3, jeu A2 (variables défavorables) — de mémoire, à confirmer" }

# Tirants
tirants:
  gamma_effet: { valeur: 1.35, source: "NF P 94-282 § 9.1 — de mémoire, à confirmer" }
  gamma_a: { valeur: 1.1, source: "NF P 94-282 § 11 / EN 1997-1 annexe A, tableau A.12 (γa;t, ancrages temporaires) — de mémoire ; 1,1 (permanents) à 1,0 selon essais, à confirmer" }
  gamma_armature: { valeur: 1.15, source: "EN 1992-1-1 § 2.4.2.4 (γs) pour une résistance fondée sur fp0,1k / fyk — de mémoire, à confirmer ; certains cahiers limitent à 0,6 fpk en service" }

# Fiches discontinues : largeur de réaction sous le fond = rapport × largeur de l'élément, plafonnée à l'entraxe
fiche_discontinue:
  rapport_largeur: { valeur: 3.0, source: "PRATIQUE FRANÇAISE (berlinoises, pieux disjoints) : butée mobilisée sur environ 3 fois la largeur de l'élément (NF P 94-282 § 5.4 renvoie à l'ingénieur) — à confirmer" }

